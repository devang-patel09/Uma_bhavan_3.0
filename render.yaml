# Render Blueprint — npm workspaces monorepo.
# Dependencies are installed once from the root package-lock.json (`cd ..`),
# then each service builds its own workspace. rootDir keeps auto-deploys
# scoped to the service's folder.
services:
  # Backend API Web Service
  - type: web
    name: uma-bhavan-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: cd .. && npm ci && npm run db:generate --workspace=server && npm run build --workspace=server
    # Apply pending Prisma migrations before each new version goes live.
    preDeployCommand: npm run db:deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 72h
      - key: COOKIE_SECRET
        generateValue: true
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  # Frontend Static Site
  - type: web
    name: uma-bhavan-ui
    runtime: static
    plan: free
    rootDir: client
    buildCommand: cd .. && npm ci && npm run build --workspace=client
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    buildFilter:
      paths:
        - client/**
        - package.json
        - package-lock.json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render passes the API's bare host; the client adds https:// and /api.
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: uma-bhavan-api
          property: host
